name: CI

on:
  push:
    branches: ["master", "repair/**"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend and configuration
        run: python -m compileall -q src/backend config

  frontend:
    name: Flutter analyze, tests, and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: src/frontend
        run: flutter pub get
      - name: Analyze
        working-directory: src/frontend
        run: flutter analyze --no-pub
      - name: Test
        working-directory: src/frontend
        run: flutter test --no-pub
      - name: Build web
        working-directory: src/frontend
        run: flutter build web --release --no-pub
